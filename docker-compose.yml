services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: game_server_cs
    ports:
      - "5432:5432"
    volumes:
      - ./DB:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gameserver-1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TCP_PORT: "9000"
      POSTGRES_CONN: "Host=postgres;Port=5432;Database=game_server_cs;Username=postgres;Password=password;Pooling=true;Minimum Pool Size=5;Maximum Pool Size=100;"
      REDIS_CONN: "redis:6379"
      ORLEANS_CLUSTER_ID: "game-server-cluster"
      ORLEANS_SERVICE_ID: "GameServerCS"
      ORLEANS_SILO_PORT: "11111"
      ORLEANS_GATEWAY_PORT: "30000"
    ports:
      - "9000:9000"

  gameserver-2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TCP_PORT: "9000"
      POSTGRES_CONN: "Host=postgres;Port=5432;Database=game_server_cs;Username=postgres;Password=password;Pooling=true;Minimum Pool Size=5;Maximum Pool Size=100;"
      REDIS_CONN: "redis:6379"
      ORLEANS_CLUSTER_ID: "game-server-cluster"
      ORLEANS_SERVICE_ID: "GameServerCS"
      ORLEANS_SILO_PORT: "11111"
      ORLEANS_GATEWAY_PORT: "30000"
    ports:
      - "9001:9000"

volumes:
  postgres-data:
